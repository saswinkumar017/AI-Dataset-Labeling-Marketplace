name: CI

# Production pipeline: every push to main and every pull request must keep
# the backend tests, the frontend checks, and both Docker images green.
# A failing job blocks the run — a broken build is never promoted.
#
# Deployment to hosting is intentionally NOT wired here: no hosting target
# has been chosen yet, and this pipeline will not pretend to deploy. When a
# target is chosen, add a deploy job gated on main + green builds, reading
# credentials only from GitHub Secrets (never hardcoded).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        # H2-backed suite: no external database service required.
        run: mvn -f server/pom.xml clean verify

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images (validate)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
