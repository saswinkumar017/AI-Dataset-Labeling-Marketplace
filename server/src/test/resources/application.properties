spring.datasource.url=jdbc:h2:mem:labelmate_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=test-secret-key-that-is-at-least-32-chars-long-for-tests-1234567890
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:3000

# AI stays dormant in tests: NoOpAiClient is wired, no provider key needed,
# no network calls happen. Service tests mock AiClient where AI is involved.
app.ai.enabled=false
spring.ai.model.chat=none
spring.ai.openai.api-key=test-dummy-key

# Keep upload tests out of the working tree (target/ is cleaned).
app.upload.dir=target/test-uploads
