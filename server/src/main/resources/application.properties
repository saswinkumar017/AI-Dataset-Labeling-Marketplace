spring.application.name=labelmate

# Datasource is configured through environment variables.
# No real secrets are committed. Set DATABASE_URL, DATABASE_USERNAME,
# and DATABASE_PASSWORD in production. Defaults target local MySQL.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/labelmate?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT configuration comes from the environment.
# Set JWT_SECRET in production. The default below is a local development
# placeholder and must be replaced outside local development.
app.jwt.secret=${JWT_SECRET:default-dev-secret-key-that-is-at-least-32-chars-long-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS allowed origins (comma-separated, no wildcard). Frontend dev origin only.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI assistance (Spring AI, OpenAI-compatible provider via OpenRouter).
# Dormant by default: the starter creates no model beans until
# spring.ai.model.chat=openai, and LabelMate uses NoOpAiClient until
# app.ai.enabled=true. Manual annotation always works either way.
# To enable: APP_AI_ENABLED=true, SPRING_AI_MODEL_CHAT=openai,
# OPENROUTER_API_KEY=<key>, AI_MODEL=<model>.
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.model=${AI_MODEL:openrouter/auto}
app.ai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.max-prompt-chars=${AI_MAX_PROMPT_CHARS:4000}
app.ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:30}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.model=${AI_MODEL:openrouter/auto}

# Actuator: public liveness only. Detailed health (which can include
# internals) is never shown; only health/info endpoints are exposed and
# both are safe without authentication. Used by Docker healthchecks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
