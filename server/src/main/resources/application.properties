spring.application.name=labelmate

# Datasource is configured through environment variables.
# No real secrets are committed. Set DATABASE_URL, DATABASE_USERNAME,
# and DATABASE_PASSWORD in production. Defaults target local MySQL.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/labelmate?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT configuration comes from the environment.
# Set JWT_SECRET in production. The default below is a local development
# placeholder and must be replaced outside local development.
app.jwt.secret=${JWT_SECRET:default-dev-secret-key-that-is-at-least-32-chars-long-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS allowed origins (comma-separated, no wildcard). Frontend dev origin only.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
