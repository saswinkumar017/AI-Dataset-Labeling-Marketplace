spring.application.name=labelmate

# Local "server/.env" (see server/.env.example) is loaded automatically by
# DotenvLoader (config/DotenvLoader.java) so "mvn spring-boot:run" works
# without exporting variables by hand. NOTE: spring.config.import does NOT
# work for this — it only loads .properties/.yaml/.yml files and silently
# skips the extensionless dotenv name, which used to surface later as a
# cryptic "Could not resolve placeholder" crash. Container and CI
# environments pass real environment variables instead, which always take
# precedence over the file. The file is gitignored and never committed.

# Datasource is configured through environment variables.
# The password intentionally has an empty default (not a real credential):
# some local MySQL setups run with no root password. Every other datasource
# value is non-secret and keeps a local-development default that server/.env
# (or the real environment) can override. A wrong password still fails fast
# with a database connection error at startup.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/labelmate?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:mysql21}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT configuration comes from the environment. The placeholder below
# resolves to empty when JWT_SECRET is unset — JwtService then rejects it
# at startup with an actionable message (never a silent insecure default).
# Generate a secret with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS allowed origins (comma-separated, no wildcard). Empty is rejected at
# startup with an actionable message: the allowed frontend origin is
# deployment configuration, not code.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# AI assistance (Spring AI, OpenAI-compatible provider via OpenRouter).
# Dormant by default: the starter creates no model beans until
# spring.ai.model.chat=openai, and LabelMate uses NoOpAiClient until
# app.ai.enabled=true. Manual annotation always works either way.
# To enable: APP_AI_ENABLED=true, SPRING_AI_MODEL_CHAT=openai,
# OPENROUTER_API_KEY=<key>, AI_MODEL=<model>.
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.model=${AI_MODEL:openrouter/auto}
app.ai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.max-prompt-chars=${AI_MAX_PROMPT_CHARS:4000}
app.ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:30}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.model=${AI_MODEL:openrouter/auto}

# Actuator: public liveness only. Detailed health (which can include
# internals) is never shown; only health/info endpoints are exposed and
# both are safe without authentication. Used by Docker healthchecks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Dataset file uploads: local directory (development default) and a 50 MB
# cap matching the client-side check. UPLOAD_DIR can point elsewhere.
# Labeling images are capped separately at UPLOAD_MAX_IMAGE_MB each.
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-image-mb=${UPLOAD_MAX_IMAGE_MB:5}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Registration OTP (two-step email verification for signup).
# Codes are 6 digits, valid 10 minutes, resend cooldown 60s, max 5 attempts.
# Only the SHA-256 hash is stored in registration_otps (synced via JPA ddl-auto).
app.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:600}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.mail-from=${OTP_MAIL_FROM:LabelMate <no-reply@labelmate.local>}

# SMTP delivery for OTP codes (Spring Mail). Leave MAIL_HOST empty for local
# development: OtpService logs the code instead of failing when no SMTP host
# is configured. Set real values in server/.env (see server/.env.example).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
