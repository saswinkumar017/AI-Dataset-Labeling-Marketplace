spring.application.name=labelmate
# Initial backend setup only — no datasource, JWT, or AI credentials yet.
# Datasource auto-configuration is excluded so the basic context test can run
# without a database. It will be enabled in the persistence milestone.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
